id: io.pslab.PSLab
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
  - org.freedesktop.Sdk.Extension.rust-stable
command: pslab
rename-desktop-file: pslab.desktop
rename-icon: pslab
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --device-if=all:!has-input-device
  - --device=input
modules:
  - name: PSLab
    buildsystem: simple
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
      append-path: /usr/lib/sdk/llvm22/bin:/usr/lib/sdk/rust-stable/bin:/var/lib/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
      env:
        PUB_CACHE: /run/build/PSLab/.pub-cache
        CARGO_HOME: /run/build/PSLab/cargo
        RUSTUP_HOME: /var/lib/rustup
    build-commands:
      - setup-flutter.sh
      - |
        for tool_dir in $(find . -path "*/cargokit/build_tool" -type d); do
          (cd "$tool_dir" && dart pub get --offline)
        done
      - flutter build linux --release --no-pub
      - cp -r $BUNDLE_PATH /app/io.pslab.PSLab
      - mkdir -p /app/bin && ln -s /app/io.pslab.PSLab/pslab /app/bin/pslab
      - install -D linux/io.pslab.PSLab.metainfo.xml /app/share/metainfo/io.pslab.PSLab.metainfo.xml
      - install -D linux/pslab.desktop /app/share/applications/pslab.desktop
      - install -D linux/assets/pslab.png /app/share/icons/hicolor/512x512/apps/pslab.png
    sources:
      - type: git
        url: https://github.com/fossasia/pslab-app.git
        commit: e5d8a9d88b6eee3608a866eeffc9bf703c13175a
      - generated/sources/cargo.json
      - generated/sources/pubspec.json
    modules:
      - generated/modules/rustup-1.94.0.json
      - generated/modules/flutter-sdk-3.50.0.json